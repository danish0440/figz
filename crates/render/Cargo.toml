[package]
name = "figz-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FigZ renderer: the scene graph to pixels on tiny-skia (fills, gradients, images, aligned strokes, shadows, blurs, masks, blend modes, text)"

[lints]
workspace = true

[dependencies]
figz-geom = { workspace = true }
figz-color = { workspace = true }
figz-doc = { workspace = true }
figz-text = { workspace = true }
figz-pathops = { workspace = true }
tiny-skia = { workspace = true }
image = { workspace = true }
moxcms = { workspace = true }
png = { workspace = true }
crc32fast = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"
