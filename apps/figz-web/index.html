<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>FigZ</title>
  <link data-trunk rel="rust" data-bin="figz-web" data-cargo-profile="web-release" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-reference-types --enable-multivalue" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f5f5f5; }
    #figz_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #figz_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #6b6b6b; font: 14px system-ui, sans-serif; pointer-events: none; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #2c2c2c; }
      #figz_loading { color: #b8b8b8; }
    }
  </style>
</head>
<body>
  <canvas id="figz_canvas"></canvas>
  <div id="figz_loading">Loading FigZ&hellip;</div>
</body>
</html>
